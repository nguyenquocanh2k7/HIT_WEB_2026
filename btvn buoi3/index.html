<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal card</title>
  </head>
  <body>
    <div class="card">
      <img src="/anh.jpg" alt="avatar" class="avt" />
      <div class="fullname">Nguyễn Quốc Anh</div>
      <div class="major">Web Developer</div>
      <div class="information">
        <p>Địa chỉ : thôn Thượng Hội, Xã Tân Hội, huyện Đan Phượng, Hà Nội</p>
        <p>Trường Học : Đại Học Công Nghiệp Hà Nội</p>
        <p>Sở thích : Thể thao, Giải trí, Ăn uống, Lập trình, Chess</p>
      </div>
      <div class="skills">
        <span class="skill">HTML</span><br />
        <span class="skill">CSS</span><br />
        <span class="skill">JavaScript</span>
      </div>
      <div class="button">
        <a href="#" class="button follow">Follow page</a><br />
        <a href="#" class="button message">Message page</a>
      </div>
    </div>
  </body>
</html>
